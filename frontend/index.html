<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ToySwap 🧸 — Wymiana zabawek i książek</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css?v=17" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div class="promo"><span class="promo-copy">Zamknięty pilotaż rodzinny — nie jesteśmy jeszcze publicznym marketplace’em</span></div>
<header class="topbar">
  <button type="button" class="nav-toggle" id="navToggle" aria-label="Otwórz menu" aria-expanded="false">☰</button>
  <div class="brand" onclick="go(getToken() ? 'dashboard' : 'home')" role="link">
    <span class="brand-mark">🧸</span>
    <span class="brand-name">ToySwap</span>
  </div>
  <nav id="nav"></nav>
</header>

<main id="app" class="container"></main>

<footer class="footer">
  <div class="footer-ready">Chcecie dołączyć do pilotażu?</div>
  <button type="button" class="primary footer-cta-btn" onclick="findSwapsNearMe()">Dołącz do pilotażu</button>
  <p class="footer-legal">
    <a href="#costs" class="footer-costs" onclick="event.preventDefault(); go('costs')">Koszty i dostawa</a>
    ·
    <a href="#privacy" class="footer-privacy" onclick="event.preventDefault(); go('privacy')">Prywatność</a>
    ·
    <a href="#terms" class="footer-terms" onclick="event.preventDefault(); go('terms')">Regulamin</a>
    ·
    <a href="#safety" class="footer-safety" onclick="event.preventDefault(); go('safety')">Bezpieczeństwo</a>
    ·
    <a href="#rules" class="footer-rules" onclick="event.preventDefault(); go('rules')">Zasady</a>
    ·
    <a href="mailto:" class="footer-support">Wsparcie</a>
  </p>
  <span class="footer-copy">Zamknięty pilotaż rodzinny — konta tylko dla rodziców. Brak otwartego czatu między dziećmi.</span>
</footer>

<script src="/js/api.js?v=17"></script>
<script src="/js/i18n.js?v=17"></script>
<script src="/js/legal-copy.js?v=17"></script>
<script src="/js/app.js?v=17"></script>
</body>
</html>
